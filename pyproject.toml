[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools==80.10.2",
    "wheel",
    "cmake",
    "nanobind",
]

[project]
name = "cuda-tile"
dynamic = ["version"]
description = "CUDA Tile Compiler"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" }
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]
requires-python = ">=3.10, <3.15"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
  "typing-extensions",
]

[project.optional-dependencies]
tileiras = [ "cuda-toolkit[tileiras,nvcc,nvvm]>=13.2,<13.4" ]
xpu = [
    "numpy",
    "torch==2.13.0+xpu; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-xpu==3.7.2; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/nvidia/cutile-python"
Repository = "https://github.com/nvidia/cutile-python"
documentation = "https://docs.nvidia.com/cuda/cutile-python"
"Bug Tracker" = "https://github.com/nvidia/cutile-python/issues"

[tool.setuptools.dynamic]
version = {file = "src/cuda/tile/VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "cuda",
    "cuda.tile",
    "cuda.tile.compilation",
    "cuda.tile._ir",
    "cuda.tile._passes",
    "cuda.tile._bytecode",
    "cuda.tile.tune",
    "cuda.tile.jax",
]

[tool.setuptools.package-data]
"cuda.tile" = ["VERSION"]


[tool.uv]
managed = true
# Without this, uv derives a key from `packages.find.where` and stores it as an
# mtime while comparing it as an inode, so it rebuilds on every sync.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "CMakeLists.txt" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
