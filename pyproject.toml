[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools==84.0.0",
    "wheel",
]

[project]
name = "cuda-tile"
dynamic = ["version"]
description = "CUDA Tile Compiler"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" }
]
license = "Apache-2.0"
license-files = ["LICENSES/*"]
requires-python = ">=3.11, <3.16"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
  "typing-extensions",
]

[project.optional-dependencies]
tileiras = [ "cuda-toolkit[tileiras,nvcc,nvvm]>=13.2,<13.6" ]

[project.urls]
Homepage = "https://github.com/nvidia/cutile-python"
Repository = "https://github.com/nvidia/cutile-python"
documentation = "https://docs.nvidia.com/cuda/cutile-python"
"Bug Tracker" = "https://github.com/nvidia/cutile-python/issues"

[project.scripts]
cutile-cache = "cutile_cache._cli:main"

[tool.setuptools.dynamic]
version = {file = "src/cuda/tile/VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "cutile_cache",
    "cuda",
    "cuda.tile",
    "cuda.tile.compilation",
    "cuda.tile._ir",
    "cuda.tile._passes",
    "cuda.tile._bytecode",
    "cuda.tile._library_lifecycle",
    "cuda.tile._backends",
    "cuda.tile._backends.cpu",
    "cuda.tile._backends.xpu",
    "cuda.tile.tune",
    "cuda.tile.jax",
]

[tool.setuptools.package-data]
"cuda.tile" = ["VERSION", "_cext.pyi"]
"cuda.tile._backends.cpu" = ["*.mlir"]


# Development environments of the non-CUDA variants, which build cuda-tile from
# source without build isolation (see backends/README.md):
#   CUTILE_BUILD_VARIANT=cpu uv sync --group cpu --no-build-isolation-package cuda-tile
# Dependency groups are not part of the package metadata.
[dependency-groups]
backend-build = [
    # Without build isolation, [build-system] requirements must be installed too.
    "setuptools==84.0.0",
    "wheel",
    "cmake>=3.24,<4",
    "ninja",
    "nanobind>=2.9,<3",
    "pybind11>=2.13.1",
    # CUDA headers for building _cext without a CUDA Toolkit.
    "cuda-toolkit[cudart,nvvm]>=13.2,<13.6; sys_platform == 'linux'",
]
cpu = [
    { include-group = "backend-build" },
    "numpy",
    "torch",
]
xpu = [
    { include-group = "backend-build" },
    "numpy",
    "torch==2.13.0+xpu; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    # A dependency of torch, listed so that uv takes it from the PyTorch XPU index.
    "triton-xpu==3.7.2; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]


[tool.uv]
managed = true
conflicts = [
    [{ group = "cpu" }, { group = "xpu" }],
]
# Without this, uv derives a key from `packages.find.where` and stores it as an
# mtime while comparing it as an inode, so it rebuilds on every sync.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "CMakeLists.txt" },
    { file = "cmake/**" },
    { file = "cext/**" },
    # Native sources of the non-CUDA variants.
    { file = "backends/**/CMakeLists.txt" },
    { file = "backends/**/*.cmake" },
    { file = "backends/**/*.in" },
    { file = "backends/**/*.cpp" },
    { file = "backends/**/*.h" },
    { file = "backends/tileir-to-mlir/**" },
    { env = "CUTILE_BUILD_VARIANT" },
    { env = "CMAKE_ARGS" },
    { env = "USE_LLVM_REVISION" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-xpu", group = "xpu" },
]
triton-xpu = { index = "pytorch-xpu" }
